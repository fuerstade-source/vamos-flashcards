/* ------------------------------------------------------------------
   MASCOT — a hand-drawn cartoon chameleon (SVG), color-matched to
   the active category. Now small, lives in the top bar.
------------------------------------------------------------------- */

function Mascot({ accent, dark, mood, size = 108 }) {
  // mood: "idle" | "happy" | "encourage"
  const h = Math.round((size * 128) / 108);
  const bounce = mood === "happy" ? "mascotHappy 0.6s ease" : mood === "encourage" ? "mascotWobble 0.5s ease" : "mascotIdle 3s ease-in-out infinite";
  const eyeY = mood === "happy" ? 33 : 30;

  return (
    <div style={{ position: "relative", width: size, height: h, animation: bounce, flexShrink: 0 }}>
      <svg viewBox="0 0 120 140" width={size} height={h}>
        <ellipse cx="60" cy="128" rx="30" ry="7" fill="#20232B" opacity="0.12" />
        <path d="M85 95 Q112 92 108 65 Q106 50 92 52" fill="none" stroke={dark} strokeWidth="10" strokeLinecap="round" />
        <ellipse cx="58" cy="88" rx="34" ry="30" fill={accent} stroke="#20232B" strokeWidth="4" />
        <path d="M35 62 Q58 48 82 62" fill="none" stroke="#20232B" strokeWidth="3" strokeLinecap="round" />
        <ellipse cx="34" cy="112" rx="9" ry="6" fill={dark} stroke="#20232B" strokeWidth="3" />
        <ellipse cx="82" cy="112" rx="9" ry="6" fill={dark} stroke="#20232B" strokeWidth="3" />
        <circle cx="58" cy="46" r="24" fill={accent} stroke="#20232B" strokeWidth="4" />
        <circle cx="44" cy="30" r="11" fill={accent} stroke="#20232B" strokeWidth="4" />
        <circle cx="70" cy="30" r="11" fill={accent} stroke="#20232B" strokeWidth="4" />
        <circle cx="44" cy={eyeY} r="4.5" fill="#20232B" />
        <circle cx="70" cy={eyeY} r="4.5" fill="#20232B" />
        <circle cx="45.5" cy={eyeY - 1.5} r="1.4" fill="#fff" />
        <circle cx="71.5" cy={eyeY - 1.5} r="1.4" fill="#fff" />
        {mood === "happy" ? (
          <path d="M48 54 Q58 63 68 54" fill="none" stroke="#20232B" strokeWidth="3.5" strokeLinecap="round" />
        ) : (
          <path d="M50 55 Q58 58 66 55" fill="none" stroke="#20232B" strokeWidth="3" strokeLinecap="round" />
        )}
      </svg>
      <style>{`
        @keyframes mascotIdle { 0%,100% { transform: translateY(0) rotate(-1deg);} 50% { transform: translateY(-3px) rotate(1deg);} }
        @keyframes mascotHappy { 0% { transform: scale(1) rotate(0deg);} 30% { transform: scale(1.2) rotate(-8deg);} 60% { transform: scale(1.08) rotate(5deg);} 100% { transform: scale(1) rotate(0deg);} }
        @keyframes mascotWobble { 0%,100% { transform: rotate(0deg);} 25% { transform: rotate(-10deg);} 75% { transform: rotate(10deg);} }
      `}</style>
    </div>
  );
}

/* ------------------------------------------------------------------
   VISUAL — front-of-card illustration, sized to the screen height
------------------------------------------------------------------- */

const BIG = "clamp(110px, 25vh, 230px)";

function CardVisual({ visual, accent }) {
  if (visual.type === "emoji") {
    return <div style={{ fontSize: "clamp(96px, 24vh, 210px)", lineHeight: 1 }}>{visual.value}</div>;
  }
  if (visual.type === "color") {
    return (
      <svg viewBox="0 0 100 100" style={{ width: BIG, height: BIG }}>
        <path
          d="M50 6 C68 6 88 18 92 40 C96 62 82 82 60 92 C40 100 14 92 8 68 C2 46 12 22 34 10 C39 7 44 6 50 6 Z"
          fill={visual.value}
          stroke="#20232B"
          strokeWidth="4"
        />
      </svg>
    );
  }
  if (visual.type === "number") {
    return (
      <div
        style={{
          width: BIG,
          height: BIG,
          borderRadius: "38% 62% 63% 37% / 41% 44% 56% 59%",
          background: accent,
          border: "4px solid #20232B",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          fontFamily: "'Baloo 2', sans-serif",
          fontSize: "clamp(60px, 13vh, 120px)",
          fontWeight: 700,
          color: "#20232B",
        }}
      >
        {visual.value}
      </div>
    );
  }
  return null;
}

const FEMALE_NAME_HINTS = ["paulina", "monica", "mónica", "female", "mujer", "lucia", "lucía", "helena", "elena"];

function pickSpanishVoice(voices) {
  const spanish = voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith("es"));
  if (spanish.length === 0) return null;

  const score = (v) => {
    const lang = v.lang;
    const name = v.name.toLowerCase();
    let s = 0;
    if (CENTRAL_AMERICAN_LOCALES.includes(lang)) s += 100;
    else if (LATAM_LOCALES.includes(lang)) s += 60;
    else if (lang.toLowerCase().startsWith("es")) s += 20;
    if (MALE_NAME_HINTS.some((h) => name.includes(h))) s += 30;
    if (FEMALE_NAME_HINTS.some((h) => name.includes(h))) s -= 30;
    return s;
  };

  return [...spanish].sort((a, b) => score(b) - score(a))[0];
}

function pickEnglishVoice(voices) {
  const english = voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith("en"));
  if (english.length === 0) return null;
  const preferred = ["en-US", "en-GB"];
  const score = (v) => {
    let s = 0;
    if (preferred.includes(v.lang)) s += 50;
    if (v.lang === "en-US") s += 10;
    return s;
  };
  return [...english].sort((a, b) => score(b) - score(a))[0];
}

/* ------------------------------------------------------------------
   TEXT COMPARISON — used by the speaking-practice mic feature to
   grade a spoken attempt against the correct Spanish phrase. Accent
   marks and punctuation are stripped so minor mic/ASR quirks don't
   unfairly count against the learner.
------------------------------------------------------------------- */

const NUM_WORDS = { "0": "cero", "1": "uno", "2": "dos", "3": "tres", "4": "cuatro", "5": "cinco", "6": "seis", "7": "siete", "8": "ocho", "9": "nueve", "10": "diez", "un": "uno" };
const ARTICLE_WORDS = ["el", "la", "los", "las", "un", "una"];

// Lowercase, strip accents/punctuation, and turn digits into Spanish words
// (speech recognition often writes "1" instead of "uno").
function normalizeWord(w) {
  const clean = w
    .toLowerCase()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "") // strip accents
    .replace(/[¿?¡!.,;:"']/g, "")
    .trim();
  return NUM_WORDS[clean] || clean;
}

function editDistance(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
  }
  return dp[a.length][b.length];
}

// Same word, or a one-letter slip on words of 4+ letters (the recognizer isn't perfect).
function wordsMatch(a, b) {
  if (a === b) return true;
  if (a.length >= 4 && b.length >= 4) return editDistance(a, b) <= 1;
  return false;
}

// Word order doesn't matter, articles count for much less than the noun itself.
function diffWords(said, correct) {
  const saidWords = said.trim().split(/\s+/).filter(Boolean).map(normalizeWord);
  const rawCorrect = correct.trim().split(/\s+/).filter(Boolean);
  const correctWords = rawCorrect.map(normalizeWord);
  const used = new Array(saidWords.length).fill(false);
  const rows = [];
  let total = 0;
  let got = 0;
  correctWords.forEach((cw, idx) => {
    const weight = ARTICLE_WORDS.includes(cw) ? 0.25 : 1;
    let found = -1;
    for (let i = 0; i < saidWords.length; i++) {
      if (!used[i] && wordsMatch(saidWords[i], cw)) {
        found = i;
        break;
      }
    }
    if (found >= 0) used[found] = true;
    total += weight;
    if (found >= 0) got += weight;
    rows.push({ expected: rawCorrect[idx], said: found >= 0 ? saidWords[found] : undefined, ok: found >= 0 });
  });
  const score = total ? Math.round((got / total) * 100) : 0;
  return { rows, score };
}

// Font size for the big word on a card: as large as possible without spilling out of the card.
function fitSize(text, maxVh, maxPx) {
  const longest = Math.max(...text.split(/\s+/).map((w) => w.length));
  const n = Math.max(6, longest + (/^(el|la|los|las|the)\s/i.test(text) ? 2.4 : 0));
  return `min(${maxVh}vh, ${maxPx}px, calc(${(1.35 / n).toFixed(4)} * min(100vw, 430px)))`;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}



/* "el perro" -> "the dog": nouns that carry a Spanish article get "the" in English too */
const NO_THE_ES = ["el lunes", "el martes"];

function withThe(card) {
  const hasArticle = /^(el|la|los|las)\s/i.test(card.es);
  if (card.noThe || !hasArticle || NO_THE_ES.includes(card.es)) return card.en;
  return "the " + card.en;
}

// Text sent to the voice (reads "hour / time" as "hour or time")
function speakableEn(card) {
  return withThe(card).replace(/\s*\/\s*/g, " or ");
}

// Locales tried in order for speech recognition (falls back if one isn't supported)
const RECOGNITION_LANGS = ["es-US", "es-MX", "es-ES"];

/* ------------------------------------------------------------------
   LEVELS AND SAVED PROGRESS
------------------------------------------------------------------- */

const LEVELS = [
  { id: "beginner", label: "Principiante", emoji: "🌱", color: "#8BC34A", desc: "Palabras básicas para empezar", example: "Perdón, ¿dónde está el baño?" },
  { id: "intermediate", label: "Intermedio", emoji: "🌿", color: "#FFA23E", desc: "De viaje: comer, comprar, hotel y transporte", example: "Buenas noches, una mesa para dos, por favor." },
  { id: "advanced", label: "Avanzado", emoji: "🌳", color: "#6C4AB6", desc: "Resolver problemas, trámites y conversar", example: "Como perdí el pasaporte, tuve que ir a la embajada para pedir uno nuevo." },
];
// Points needed at a level before the app suggests the next one (levels are never locked)
const LEVEL_GOALS = { beginner: 250, intermediate: 350 };
const NEXT_LEVEL = { beginner: "intermediate", intermediate: "advanced" };
// Each word carries its own example sentence, written for the level it belongs to.
function sentenceFor(card) {
  return { es: card.ex_es, en: card.ex_en, ref: card.ref };
}

const STORAGE_KEY = "vamos-flashcards-v2";

function freshProgress() {
  return { level: null, points: { beginner: 0, intermediate: 0, advanced: 0 }, known: {}, awarded: {}, offered: {} };
}

function loadProgress() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      const base = freshProgress();
      return { ...base, ...p, points: { ...base.points, ...(p.points || {}) } };
    }
  } catch (e) {}
  return freshProgress();
}

function saveProgress(p) {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
  } catch (e) {}
}

const BALOO = "'Baloo 2', sans-serif";
const menuBtnStyle = {
  width: "100%", fontFamily: BALOO, fontWeight: 700, fontSize: 14, padding: "10px 8px", borderRadius: 12,
  border: "3px solid #20232B", background: "#fff", boxShadow: "3px 3px 0 #20232B", cursor: "pointer",
  marginBottom: 12, color: "#20232B",
};

/* Small icon button used in the bottom dock */
function DockBtn({ icon, label, onClick, disabled, bg }) {
  return (
    <button
      className="btn-pop dockbtn"
      onClick={onClick}
      disabled={disabled}
      aria-label={label}
      style={{ background: bg || "#FFF9EE" }}
    >
      <span style={{ fontSize: 22, lineHeight: 1 }}>{icon}</span>
      <span style={{ fontSize: 10.5, fontWeight: 700 }}>{label}</span>
    </button>
  );
}

function SpanishFlashcards() {
  const [progress, setProgress] = useState(loadProgress);
  const [catId, setCatId] = useState(() => CATEGORIES_BY_LEVEL[progress.level || "beginner"][0].id);
  const [order, setOrder] = useState(() => DECKS[catId].map((_, i) => i));
  const [index, setIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const progressRef = useRef(progress);
  progressRef.current = progress;
  const lv = progress.level || "beginner"; // current level
  const mastered = progress.known; // key: level|es -> true
  const [screen, setScreen] = useState(progress.level ? "home" : "levels"); // "levels" | "home" | "play"
  const [levelUp, setLevelUp] = useState(null); // id of the level we are offering, or null
  const [mood, setMood] = useState("idle");
  const [toast, setToast] = useState("");
  const [slide, setSlide] = useState("next"); // direction of the card entrance animation
  const [sheet, setSheet] = useState(null); // null | "cat" | "menu"
  const [voices, setVoices] = useState([]);
  const [isSpeaking, setIsSpeaking] = useState(false);
  const [audioSupported, setAudioSupported] = useState(true);
  const [showDiag, setShowDiag] = useState(false);
  const [volume, setVolume] = useState(1);
  const voiceRef = useRef(null);
  const englishVoiceRef = useRef(null);
  const toastTimer = useRef(null);

  // Swipe gesture tracking on the flashcard
  const swipeStartRef = useRef(null);
  const swipedRef = useRef(false);

  // Speaking-practice (mic) state
  const [micSupported, setMicSupported] = useState(true);
  const [listening, setListening] = useState(false);
  const [speechResult, setSpeechResult] = useState(null);
  const [micError, setMicError] = useState("");
  const recognitionRef = useRef(null);

  // App mode: flashcards vs. listening quiz
  const [mode, setMode] = useState("cards");
  const [quizQuestion, setQuizQuestion] = useState(null);
  const [quizSelected, setQuizSelected] = useState(null);
  const [quizScore, setQuizScore] = useState({ correct: 0, total: 0 });

  const levelCats = CATEGORIES_BY_LEVEL[lv];
  const category = ALL_CATEGORIES.find((c) => c.id === catId) || levelCats[0];
  const deck = DECKS[category.id];
  const card = deck[order[index]] || deck[0];
  const isKnown = !!mastered[`${lv}|${card.es}`];
  const sent = sentenceFor(card);
  const levelInfo = LEVELS.find((l) => l.id === lv);
  const levelPoints = progress.points[lv] || 0;
  const levelGoal = LEVEL_GOALS[lv] || 0;

  useEffect(() => {
    if (typeof window === "undefined" || !window.speechSynthesis) {
      setAudioSupported(false);
      return;
    }
    const loadVoices = () => {
      const list = window.speechSynthesis.getVoices();
      if (list.length) {
        setVoices(list);
        voiceRef.current = pickSpanishVoice(list);
        englishVoiceRef.current = pickEnglishVoice(list);
      }
    };
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
    return () => {
      if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = null;
    };
  }, []);

  useEffect(() => {
    const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
    setMicSupported(!!SR);
  }, []);

  // Clear the mic result whenever the card changes.
  useEffect(() => {
    setSpeechResult(null);
    setMicError("");
  }, [catId, index]);

  useEffect(() => {
    const t = setTimeout(() => setMood("idle"), 900);
    return () => clearTimeout(t);
  }, [mood]);

  // Save progress on this phone.
  useEffect(() => {
    saveProgress(progress);
  }, [progress]);

  // Offer the next level once enough points are earned at the current one.
  useEffect(() => {
    const cur = progress.level;
    const next = NEXT_LEVEL[cur];
    if (!cur || !next) return;
    if ((progress.points[cur] || 0) >= LEVEL_GOALS[cur] && !progress.offered[next]) {
      setLevelUp(next);
      setMood("happy");
      setProgress((p) => ({ ...p, offered: { ...p.offered, [next]: true } }));
    }
  }, [progress.points, progress.level]);

  function showToast(text) {
    setToast(text);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 1300);
  }

  function randomOf(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function speak(text, opts = {}) {
    if (!audioSupported || typeof window === "undefined" || !window.speechSynthesis) return;
    const { lang = "es", rate = 0.9, onEnd } = opts;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voice = lang === "en" ? englishVoiceRef.current : voiceRef.current;
    utter.lang = voice ? voice.lang : lang === "en" ? "en-US" : "es-419";
    if (voice) utter.voice = voice;
    utter.rate = rate;
    utter.volume = volume;
    utter.pitch =
      lang === "en" || (voice && MALE_NAME_HINTS.some((h) => voice.name.toLowerCase().includes(h))) ? 1 : 0.85;
    utter.onstart = () => setIsSpeaking(true);
    utter.onend = () => {
      setIsSpeaking(false);
      if (onEnd) onEnd();
    };
    utter.onerror = () => setIsSpeaking(false);
    window.speechSynthesis.speak(utter);
  }

  function speakSpanish(text, rate = 0.9) {
    speak(text, { lang: "es", rate });
  }
  // Says the pair: "el perro ... dog"
  function speakBoth(esText, enText) {
    speak(esText, { lang: "es", rate: 0.9, onEnd: () => speak(enText, { lang: "en", rate: 0.95 }) });
  }

  const masteredCount = useMemo(
    () => deck.filter((c) => mastered[`${lv}|${c.es}`]).length,
    [deck, mastered, lv]
  );

  // Points are earned once per word, per activity and per level, so repeating a card never adds more.
  function addPoints(n, awardKey) {
    if (progressRef.current.awarded[awardKey]) return false;
    progressRef.current = { ...progressRef.current, awarded: { ...progressRef.current.awarded, [awardKey]: true } };
    setProgress((p) => {
      if (p.awarded[awardKey]) return p;
      const L = p.level || "beginner";
      return {
        ...p,
        awarded: { ...p.awarded, [awardKey]: true },
        points: { ...p.points, [L]: (p.points[L] || 0) + n },
      };
    });
    return true;
  }

  function pickCategory(id) {
    setSlide("next");
    setCatId(id);
    setOrder(DECKS[id].map((_, i) => i));
    setIndex(0);
    setFlipped(false);
    setMood("idle");
    setSheet(null);
    setMode("cards");
    setScreen("play");
  }

  function goNext() {
    setSlide("next");
    setFlipped(false);
    const nextIndex = (index + 1) % order.length;
    setIndex(nextIndex);
    speak(deck[order[nextIndex]].es);
  }

  function goPrev() {
    setSlide("prev");
    setFlipped(false);
    const prevIndex = (index - 1 + order.length) % order.length;
    setIndex(prevIndex);
    speak(deck[order[prevIndex]].es);
  }

  function doShuffle() {
    const newOrder = shuffle(deck.map((_, i) => i));
    setSlide("next");
    setOrder(newOrder);
    setIndex(0);
    setFlipped(false);
    setMood("idle");
    setSheet(null);
    showToast("¡Barajado!");
    speak(deck[newOrder[0]].es);
  }

  // Tap: flip the card back and forth and say the side that appears
  // ("el perro" <-> "dog"), as many times as you like.
  // Only a swipe (or the keyboard arrows) changes the word.
  function handleCardTap() {
    if (swipedRef.current) {
      swipedRef.current = false;
      return;
    }
    if (flipped) {
      setFlipped(false);
      speak(card.es, { lang: "es", rate: 0.9 });
    } else {
      setFlipped(true);
      speak(speakableEn(card), { lang: "en", rate: 0.95 });
    }
  }

  // Swipe: left -> next, right -> previous (front or back).
  function handleSwipeStart(e) {
    swipeStartRef.current = { x: e.clientX, y: e.clientY };
    swipedRef.current = false;
  }
  function handleSwipeEnd(e) {
    const start = swipeStartRef.current;
    swipeStartRef.current = null;
    if (!start) return;
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      swipedRef.current = true;
      if (dx < 0) goNext();
      else goPrev();
    }
  }
  function handleSwipeCancel() {
    swipeStartRef.current = null;
  }

  // "Lo sé" marks the word as known (+10 points the first time at each level) and moves on;
  // tap it again on a known word to unmark it.
  function toggleKnown() {
    const key = `${lv}|${card.es}`;
    if (mastered[key]) {
      setProgress((p) => {
        const known = { ...p.known };
        delete known[key];
        return { ...p, known };
      });
      setMood("encourage");
      showToast("Sigue practicando");
    } else {
      setProgress((p) => ({ ...p, known: { ...p.known, [key]: true } }));
      const got = addPoints(10, "k|" + key);
      setMood("happy");
      showToast(randomOf(ENCOURAGE) + (got ? " +10 ⭐" : ""));
      setTimeout(goNext, 500);
    }
  }

  // Keyboard support for desktop: ← → to move, space/enter to flip.
  const keyRef = useRef({});
  keyRef.current = { mode, sheet, screen, levelUp, goNext, goPrev, handleCardTap };
  useEffect(() => {
    const onKey = (e) => {
      const k = keyRef.current;
      if (k.screen !== "play" || k.mode !== "cards" || k.sheet || k.levelUp) return;
      if (e.key === "ArrowRight") k.goNext();
      else if (e.key === "ArrowLeft") k.goPrev();
      else if (e.key === " " || e.key === "Enter") {
        if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
        e.preventDefault();
        k.handleCardTap();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  /* ------------------------------------------------------------
     SPEAKING PRACTICE (mic)
  ------------------------------------------------------------ */
  function startListening(langIndex = 0) {
    const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
    if (!SR) {
      setMicError("El reconocimiento de voz no está disponible en este navegador.");
      return;
    }
    setMicError("");
    setSpeechResult(null);
    // Stop any voice that is still talking so the microphone doesn't pick it up.
    if (typeof window !== "undefined" && window.speechSynthesis) window.speechSynthesis.cancel();

    const recognition = new SR();
    recognition.lang = RECOGNITION_LANGS[langIndex];
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 5;

    recognition.onstart = () => setListening(true);
    recognition.onresult = (e) => {
      // Take the best-matching of the recognizer's alternatives.
      const alts = Array.from(e.results[0]).map((a) => a.transcript);
      let best = null;
      alts.forEach((t) => {
        const d = diffWords(t, card.es);
        if (!best || d.score > best.score) best = { transcript: t, ...d };
      });
      if (best) {
        setSpeechResult(best);
        if (best.score >= 80 && addPoints(5, "s|" + lv + "|" + card.es)) showToast("¡Bien dicho! +5 ⭐");
      }
    };
    recognition.onerror = (e) => {
      setListening(false);
      if (e.error === "language-not-supported" && langIndex + 1 < RECOGNITION_LANGS.length) {
        startListening(langIndex + 1);
        return;
      }
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        setMicError("Permiso de micrófono denegado. Revisa los permisos del navegador.");
      } else if (e.error === "no-speech") {
        setMicError("No se detectó voz. Inténtalo de nuevo.");
      } else {
        setMicError("No se pudo usar el micrófono. Inténtalo de nuevo.");
      }
    };
    recognition.onend = () => setListening(false);

    recognitionRef.current = recognition;
    try {
      recognition.start();
    } catch {
      setMicError("No se pudo iniciar el micrófono.");
    }
  }

  function stopListening() {
    if (recognitionRef.current) recognitionRef.current.stop();
    setListening(false);
  }

  /* ------------------------------------------------------------
     LISTENING QUIZ
  ------------------------------------------------------------ */
  // Beginner hears a word and picks its meaning; intermediate and advanced hear the level's sentence
  // and pick its translation.
  const quizByWord = lv === "beginner";
  function quizAudioText(w) {
    return quizByWord ? w.es : sentenceFor(w).es;
  }
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  function quizOptionText(w) {
    return cap(quizByWord ? withThe(w) : sentenceFor(w).en);
  }

  function newQuizQuestion() {
    const all = levelCats.flatMap((c) => DECKS[c.id]);
    const correct = all[Math.floor(Math.random() * all.length)];
    const distractors = shuffle(all.filter((w) => quizOptionText(w) !== quizOptionText(correct))).slice(0, 3);
    const options = shuffle([correct, ...distractors]);
    setQuizQuestion({ word: correct, options, correctIndex: options.indexOf(correct) });
    setQuizSelected(null);
  }

  function selectQuizAnswer(i) {
    if (quizSelected !== null) return;
    setQuizSelected(i);
    const isCorrect = i === quizQuestion.correctIndex;
    setQuizScore((s) => ({ correct: s.correct + (isCorrect ? 1 : 0), total: s.total + 1 }));
    setMood(isCorrect ? "happy" : "encourage");
    const got = isCorrect && addPoints(5, "q|" + lv + "|" + quizQuestion.word.es);
    showToast(isCorrect ? randomOf(ENCOURAGE) + (got ? " +5 ⭐" : "") : randomOf(NUDGE));
  }

  function openQuiz() {
    setMode("quiz");
    setScreen("play");
    setSheet(null);
    newQuizQuestion();
  }

  function goHome() {
    if (typeof window !== "undefined" && window.speechSynthesis) window.speechSynthesis.cancel();
    setScreen("home");
    setSheet(null);
  }

  function openFirstCategory(level) {
    const first = CATEGORIES_BY_LEVEL[level][0].id;
    setCatId(first);
    setOrder(DECKS[first].map((_, i) => i));
    setIndex(0);
    setFlipped(false);
  }

  function chooseLevel(id) {
    setProgress((p) => ({ ...p, level: id }));
    openFirstCategory(id);
    setQuizQuestion(null);
    setQuizScore({ correct: 0, total: 0 });
    setLevelUp(null);
    setScreen("home");
    setSheet(null);
  }

  function resetProgress() {
    if (typeof window !== "undefined" && !window.confirm("¿Borrar todos los puntos y el progreso?")) return;
    setProgress(freshProgress());
    openFirstCategory("beginner");
    setQuizQuestion(null);
    setQuizScore({ correct: 0, total: 0 });
    setLevelUp(null);
    setScreen("levels");
    setSheet(null);
  }

  const mascotAccent = mode === "quiz" ? "#6C4AB6" : category.accent;
  const mascotDark = mode === "quiz" ? "#3A2668" : category.dark;

  return (
    <div
      style={{
        width: "100%",
        minHeight: "100vh",
        display: "flex",
        justifyContent: "center",
        alignItems: "center",
        background: "#FFE380",

                    style={{
                      marginTop: 14, fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 16,
                      padding: "12px 18px", borderRadius: 14, border: "3px solid #20232B",
                      background: "#FFE380", boxShadow: "4px 4px 0 #20232B", cursor: "pointer", color: "#20232B",
                    }}
                  >
                    Siguiente pregunta ▶
                  </button>
                )}
              </div>
            )}
          </div>
        )}
        </>
        )}
      </div>

      {/* ---------- Level-up offer ---------- */}
      {levelUp && (
        <div className="backdrop" style={{ alignItems: "center" }} onClick={() => setLevelUp(null)}>
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              width: "calc(100% - 40px)", maxWidth: 360, background: "#FFF9EE", border: "4px solid #20232B",
              borderRadius: 26, boxShadow: "8px 8px 0 #20232B", padding: 20, textAlign: "center",
            }}
          >
            <div style={{ fontSize: 54, lineHeight: 1 }}>🎉</div>
            <div style={{ fontFamily: BALOO, fontWeight: 800, fontSize: 25, marginTop: 6 }}>¡Subiste de nivel!</div>
            <div style={{ fontWeight: 600, fontSize: 15, margin: "8px 0 16px", lineHeight: 1.4 }}>
              Ya tienes {levelPoints} puntos en {levelInfo.label}. ¿Quieres pasar a {LEVELS.find((l) => l.id === levelUp).label}?
            </div>
            <button className="btn-pop" onClick={() => chooseLevel(levelUp)} style={{ ...menuBtnStyle, background: "#B7F0C6" }}>
              Pasar a {LEVELS.find((l) => l.id === levelUp).label} ▶
            </button>
            <button className="btn-pop" onClick={() => setLevelUp(null)} style={{ ...menuBtnStyle, marginBottom: 0 }}>
              Seguir en {levelInfo.label}
            </button>
          </div>
        </div>
      )}

      {/* ---------- Options sheet ---------- */}
      {sheet === "menu" && (
        <div className="backdrop" onClick={() => setSheet(null)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 800, fontSize: 20, marginBottom: 12 }}>
              Opciones
            </div>

            {screen !== "home" && (
              <button className="btn-pop" onClick={goHome} style={menuBtnStyle}>
                🏠 Inicio (categorías)
              </button>
            )}
            <button className="btn-pop" onClick={() => { setScreen("levels"); setSheet(null); }} style={menuBtnStyle}>
              🎓 Cambiar de nivel
            </button>

            <div style={{ display: "flex", alignItems: "center", gap: 10, background: "#fff", border: "3px solid #20232B", borderRadius: 12, padding: "8px 12px", marginBottom: 14 }}>
              <span style={{ fontSize: 18 }}>{volume === 0 ? "🔇" : volume < 0.5 ? "🔉" : "🔊"}</span>
              <input
                type="range" min="0" max="1" step="0.05" value={volume}
                onChange={(e) => setVolume(parseFloat(e.target.value))}
                aria-label="Volumen"
                style={{ flex: 1, accentColor: category.accent }}
              />
            </div>

            {screen === "play" && mode === "cards" && (
              <button
                className="btn-pop"
                onClick={doShuffle}
                style={{
                  width: "100%", fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 14,
                  padding: "10px 8px", borderRadius: 12, border: "3px solid #20232B", background: "#fff",
                  boxShadow: "3px 3px 0 #20232B", cursor: "pointer", marginBottom: 14, color: "#20232B",
                }}
              >
                🔀 Barajar tarjetas
              </button>
            )}

            <button className="btn-pop" onClick={resetProgress} style={{ ...menuBtnStyle, background: "#FFD2D2" }}>
              🗑️ Reiniciar puntos y progreso
            </button>

            <button
              onClick={() => setShowDiag((d) => !d)}
              style={{ background: "none", border: "none", textDecoration: "underline", fontSize: 12.5, fontWeight: 700, color: "#20232B", opacity: 0.6, cursor: "pointer", padding: 0 }}
            >
              {showDiag ? "ocultar diagnóstico de audio ▲" : "¿no hay audio? revisa aquí 🔍"}
            </button>
            <div style={{ marginTop: 12, fontSize: 11, fontWeight: 600, opacity: 0.55, lineHeight: 1.5 }}>
              Versículos: Reina-Valera 1960 © Sociedades Bíblicas en América Latina, 1960; renovado © Sociedades Bíblicas Unidas, 1988. Inglés: King James Version.
            </div>

            {showDiag && (
              <div style={{ marginTop: 10, background: "#fff", border: "3px solid #20232B", borderRadius: 14, padding: "10px 12px", fontSize: 12.5, fontWeight: 600, lineHeight: 1.7 }}>
                <div>🔧 API compatible: {audioSupported ? "✅ sí" : "❌ no — tu navegador no soporta audio de voz"}</div>
                <div>🎙️ Voces en español encontradas: {voices.filter((v) => v.lang.toLowerCase().startsWith("es")).length}</div>
                <div>🗣️ Voz seleccionada: {voiceRef.current ? `${voiceRef.current.name} (${voiceRef.current.lang})` : "ninguna — usando voz predeterminada del sistema"}</div>
                <button
                  className="btn-pop"
                  onClick={() => speak("Hola, esto es una prueba de audio.")}
                  style={{ marginTop: 8, fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 13, padding: "8px 14px", borderRadius: 12, border: "3px solid #20232B", background: "#FFE380", boxShadow: "3px 3px 0 #20232B", cursor: "pointer", color: "#20232B" }}
                >
                  🔊 Probar audio ahora
                </button>
                <div style={{ marginTop: 8, opacity: 0.7, fontWeight: 500 }}>
                  Si no suena: revisa el interruptor de silencio (iPhone), el volumen de medios (no el del timbre), o instala una voz en español en los ajustes de tu teléfono.
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SpanishFlashcards />);
</script>
</body>
</html>
