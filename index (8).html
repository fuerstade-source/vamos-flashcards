   SPEECH + TEXT HELPERS
------------------------------------------------------------------- */

const CENTRAL_AMERICAN_LOCALES = ["es-GT", "es-HN", "es-SV", "es-NI", "es-CR", "es-PA"];
const LATAM_LOCALES = ["es-419", "es-MX", "es-US", "es-DO", "es-VE", "es-CO"];
const MALE_NAME_HINTS = ["jorge", "diego", "juan", "carlos", "miguel", "male", "hombre", "varon"];
const FEMALE_NAME_HINTS = ["paulina", "monica", "mónica", "female", "mujer", "lucia", "lucía", "helena", "elena"];

function pickSpanishVoice(voices) {
  const spanish = voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith("es"));
  if (spanish.length === 0) return null;

  const score = (v) => {
    const lang = v.lang;
    const name = v.name.toLowerCase();
    let s = 0;
    if (CENTRAL_AMERICAN_LOCALES.includes(lang)) s += 100;
    else if (LATAM_LOCALES.includes(lang)) s += 60;
    else if (lang.toLowerCase().startsWith("es")) s += 20;
    if (MALE_NAME_HINTS.some((h) => name.includes(h))) s += 30;
    if (FEMALE_NAME_HINTS.some((h) => name.includes(h))) s -= 30;
    return s;
  };

  return [...spanish].sort((a, b) => score(b) - score(a))[0];
}

function pickEnglishVoice(voices) {
  const english = voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith("en"));
  if (english.length === 0) return null;
  const preferred = ["en-US", "en-GB"];
  const score = (v) => {
    let s = 0;
    if (preferred.includes(v.lang)) s += 50;
    if (v.lang === "en-US") s += 10;
    return s;
  };
  return [...english].sort((a, b) => score(b) - score(a))[0];
}

/* ------------------------------------------------------------------
   TEXT COMPARISON — used by the speaking-practice mic feature to
   grade a spoken attempt against the correct Spanish phrase. Accent
   marks and punctuation are stripped so minor mic/ASR quirks don't
   unfairly count against the learner.
------------------------------------------------------------------- */

const NUM_WORDS = { "0": "cero", "1": "uno", "2": "dos", "3": "tres", "4": "cuatro", "5": "cinco", "6": "seis", "7": "siete", "8": "ocho", "9": "nueve", "10": "diez", "un": "uno" };
const ARTICLE_WORDS = ["el", "la", "los", "las", "un", "una"];

// Lowercase, strip accents/punctuation, and turn digits into Spanish words
// (speech recognition often writes "1" instead of "uno").
function normalizeWord(w) {
  const clean = w
    .toLowerCase()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "") // strip accents
    .replace(/[¿?¡!.,;:"']/g, "")
    .trim();
  return NUM_WORDS[clean] || clean;
}

function editDistance(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
  }
  return dp[a.length][b.length];
}

// Same word, or a one-letter slip on words of 4+ letters (the recognizer isn't perfect).
function wordsMatch(a, b) {
  if (a === b) return true;
  if (a.length >= 4 && b.length >= 4) return editDistance(a, b) <= 1;
  return false;
}

// Word order doesn't matter, articles count for much less than the noun itself.
function diffWords(said, correct) {
  const saidWords = said.trim().split(/\s+/).filter(Boolean).map(normalizeWord);
  const rawCorrect = correct.trim().split(/\s+/).filter(Boolean);
  const correctWords = rawCorrect.map(normalizeWord);
  const used = new Array(saidWords.length).fill(false);
  const rows = [];
  let total = 0;
  let got = 0;
  correctWords.forEach((cw, idx) => {
    const weight = ARTICLE_WORDS.includes(cw) ? 0.25 : 1;
    let found = -1;
    for (let i = 0; i < saidWords.length; i++) {
      if (!used[i] && wordsMatch(saidWords[i], cw)) {
        found = i;
        break;
      }
    }
    if (found >= 0) used[found] = true;
    total += weight;
    if (found >= 0) got += weight;
    rows.push({ expected: rawCorrect[idx], said: found >= 0 ? saidWords[found] : undefined, ok: found >= 0 });
  });
  const score = total ? Math.round((got / total) * 100) : 0;
  return { rows, score };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}



/* "el perro" -> "the dog": nouns that carry a Spanish article get "the" in English too */
const NO_THE_ES = ["el lunes", "el martes"];

function withThe(card) {
  const hasArticle = /^(el|la|los|las)\s/i.test(card.es);
  if (!hasArticle || NO_THE_ES.includes(card.es)) return card.en;
  return "the " + card.en;
}

// Text sent to the voice (reads "hour / time" as "hour or time")
function speakableEn(card) {
  return withThe(card).replace(/\s*\/\s*/g, " or ");
}

I put on thick socks when it's cold in the house."],"a":["Nunca encuentro los dos calcetines iguales, así que siempre salgo con uno de cada color.","I never find both socks matching, so I always go out with one of each color."]},"la falda":{"b":["La falda es corta.","The skirt is short."],"i":["Mi hermana lleva una falda larga en las fiestas de la familia.","My sister wears a long skirt at family parties."],"a":["Cuando probé la falda, descubrí que me quedaba perfecta, así que la compré sin pensarlo.","When I tried on the skirt, I found it fit me perfectly, so I bought it without thinking."]},"las gafas":{"b":["Uso gafas.","I wear glasses."],"i":["Uso gafas para leer porque no veo bien de cerca.","I wear glasses to read because I can't see well up close."],"a":["Busqué mis gafas por toda la casa y, al final, estaban sobre mi cabeza.","I looked for my glasses all over the house and, in the end, they were on top of my head."]},"la bufanda":{"b":["La bufanda es suave.","The scarf is soft."],"i":["Mi abuela me teje una bufanda nueva cada invierno.","My grandmother knits me a new scarf every winter."],"a":["Me puse la bufanda antes de salir porque el pronóstico decía que haría mucho frío.","I put on the scarf before going out because the forecast said it would be very cold."]},"el ojo":{"b":["Cierro el ojo.","I close my eye."],"i":["Me duele el ojo cuando miro la pantalla por mucho tiempo.","My eye hurts when I look at the screen for a long time."],"a":["Me entró algo en el ojo mientras manejaba, así que tuve que detener el coche.","Something got in my eye while I was driving, so I had to stop the car."]},"la nariz":{"b":["Me pica la nariz.","My nose itches."],"i":["Me limpio la nariz con un pañuelo cuando tengo gripe.","I wipe my nose with a tissue when I have a cold."],"a":["Como estaba resfriado, tenía la nariz roja y no pude oler la comida que preparó mi madre.","Since I had a cold, my nose was red and I couldn't smell the food my mother prepared."]},"la oreja":{"b":["Me duele la oreja.","My ear hurts."],"i":["Me duele la oreja cuando nado mucho tiempo en la piscina.","My ear hurts when I swim for a long time in the pool."],"a":["El perro movió la oreja cuando escuchó que alguien abría la puerta.","The dog moved his ear when he heard someone opening the door."]},"la boca":{"b":["Abro la boca.","I open my mouth."],"i":["Abro la boca grande cuando voy al dentista cada seis meses.","I open my mouth wide when I go to the dentist every six months."],"a":["Cuando probé la sopa caliente, me quemé la boca y no pude comer nada más.","When I tasted the hot soup, I burned my mouth and couldn't eat anything else."]},"la mano":{"b":["Levanto la mano.","I raise my hand."],"i":["Levanto la mano cuando quiero hablar en la clase.","I raise my hand when I want to speak in class."],"a":["Me lastimé la mano mientras cerraba la puerta, y ahora no puedo escribir.","I hurt my hand while closing the door, and now I can't write."]},"el pie":{"b":["Me duele el pie.","My foot hurts."],"i":["Me duele el pie cuando camino mucho con zapatos nuevos.","My foot hurts when I walk a lot in new shoes."],"a":["Me torcí el pie al bajar la escalera y tuve que quedarme en casa toda la semana.","I twisted my foot going down the stairs and had to stay home all week."]},"el brazo":{"b":["Levanto el brazo.","I raise my arm."],"i":["Mi hermano tiene el brazo muy fuerte porque juega béisbol cada domingo.","My brother has a very strong arm because he plays baseball every Sunday."],"a":["Cuando se cayó de la bicicleta, se rompió el brazo y tuvo que usar yeso durante un mes.","When he fell off his bike, he broke his arm and had to wear a cast for a month."]},"la pierna":{"b":["Me duele la pierna.","My leg hurts."],"i":["Me duele la pierna después de correr cinco kilómetros.","My leg hurts after running five kilometers."],"a":["Después de que me operaron la pierna, caminé con muletas hasta que el médico me dio permiso para dejarlas.","After they operated on my leg, I walked with crutches until the doctor gave me permission to stop using them."]},"el corazón":{"b":["El corazón late.","The heart beats."],"i":["Mi corazón late muy rápido cuando corro por la mañana.","My heart beats very fast when I run in the morning."],"a":["Cuando escuché la buena noticia, sentí que el corazón se me salía del pecho.","When I heard the good news, I felt my heart was jumping out of my chest."]},"el pelo":{"b":["Tengo el pelo largo.","I have long hair."],"i":["Me lavo el pelo cada dos días con agua tibia.","I wash my hair every other day with warm water."],"a":["Mi madre me cortó el pelo en la cocina para que no gastáramos dinero en la peluquería.","My mother cut my hair in the kitchen so that we wouldn't spend money at the hair salon."]},"el sol":{"b":["El sol brilla.","The sun shines."],"i":["El sol brilla fuerte y por eso uso sombrero en la playa.","The sun shines strongly, so I wear a hat at the beach."],"a":["Cuando salió el sol después de tres días de lluvia, todos corrieron a la calle.","When the sun came out after three days of rain, everyone ran out into the street."]},"la lluvia":{"b":["La lluvia cae.","The rain falls."],"i":["La lluvia cae todas las tardes y las calles se llenan de agua.","The rain falls every afternoon and the streets fill with water."],"a":["Salimos sin paraguas y la lluvia nos mojó tanto que tuvimos que cambiarnos de ropa.","We went out without an umbrella and the rain soaked us so much that we had to change clothes."]},"la nieve":{"b":["La nieve es blanca.","The snow is white."],"i":["La nieve cubre las montañas durante el invierno.","The snow covers the mountains during the winter."],"a":["Los niños esperaron toda la semana a que cayera la nieve para poder hacer un muñeco.","The kids waited all week for the snow to fall so they could build a snowman."]},"el viento":{"b":["El viento sopla.","The wind blows."],"i":["El viento sopla muy fuerte en la playa por las tardes.","The wind blows very hard at the beach in the afternoons."],"a":["El viento era tan fuerte que se llevó el paraguas de mi vecino por encima de la casa.","The wind was so strong that it carried my neighbor's umbrella over the house."]},"la nube":{"b":["La nube es gris.","The cloud is gray."],"i":["Veo una nube grande que viene hacia nosotros desde la montaña.","I see a big cloud coming toward us from the mountain."],"a":["Una nube negra cubrió el cielo de repente, y poco después empezó a llover.","A black cloud suddenly covered the sky, and soon after it started to rain."]},"la tormenta":{"b":["La tormenta llega.","The storm arrives."],"i":["La tormenta llega por la noche y hace mucho ruido.","The storm arrives at night and makes a lot of noise."],"a":["Cuando empezó la tormenta, nos quedamos en casa hasta que se fue la luz y encendimos unas velas.","When the storm started, we stayed home until the power went out and we lit some candles."]},"el arcoíris":{"b":["Veo un arcoíris.","I see a rainbow."],"i":["El arcoíris aparece cuando sale el sol después de la lluvia.","The rainbow appears when the sun comes out after the rain."],"a":["Después de la tormenta salimos al patio y vimos un arcoíris que cruzaba todo el cielo.","After the storm we went out to the patio and saw a rainbow that crossed the whole sky."]},"el calor":{"b":["Hace calor.","It's hot."],"i":["Hace mucho calor en verano y bebo agua todo el día.","It's very hot in summer and I drink water all day."],"a":["Había tanto calor que decidimos cancelar el paseo y quedarnos en casa con el ventilador.","It was so hot that we decided to cancel the outing and stay home with the fan."]},"el frío":{"b":["Hace frío.","It's cold."],"i":["Hace mucho frío en la mañana y me pongo una chaqueta.","It's very cold in the morning and I put on a jacket."],"a":["Aunque hacía mucho frío, salimos a caminar porque necesitábamos aire fresco.","Although it was very cold, we went out for a walk because we needed fresh air."]},"la niebla":{"b":["Hay niebla.","There is fog."],"i":["Hay mucha niebla en la montaña y no se ve el camino.","There is a lot of fog on the mountain and you can't see the road."],"a":["Manejamos despacio porque la niebla era tan espesa que apenas veíamos el coche de adelante.","We drove slowly because the fog was so thick that we could barely see the car in front."]},"el lunes":{"b":["Hoy es lunes.","Today is Monday."],"i":["El lunes empiezo a trabajar a las ocho de la mañana.","On Monday I start work at eight in the morning."],"a":["El lunes pasado llegué tarde porque se me olvidó poner la alarma.","Last Monday I arrived late because I forgot to set the alarm."]},"el martes":{"b":["Hoy es martes.","Today is Tuesday."],"i":["Tengo clase de español todos los martes por la tarde.","I have a Spanish class every Tuesday afternoon."],"a":["El martes que viene viajamos a la playa, siempre que no llueva.","Next Tuesday we're traveling to the beach, as long as it doesn't rain."]},"hoy":{"b":["Hoy estudio.","Today I study."],"i":["Hoy estudio español por una hora después de la cena.","Today I study Spanish for an hour after dinner."],"a":["Hoy me desperté antes de que sonara la alarma y pude hacer todo lo que había planeado.","Today I woke up before the alarm rang and was able to do everything I had planned."]},"mañana":{"b":["Mañana voy a la playa.","Tomorrow I'm going to the beach."],"i":["Mañana voy a visitar a mi abuela y llevaré pan para el desayuno.","Tomorrow I'm going to visit my grandmother and I'll bring bread for breakfast."],"a":["Si mañana no llueve, saldremos temprano para llegar antes de que haya mucha gente.","If it doesn't rain tomorrow, we'll leave early to arrive before there are many people."]},"ayer":{"b":["Ayer llovió.","Yesterday it rained."],"i":["Ayer comí con mi familia y después vimos una película.","Yesterday I ate with my family and afterward we watched a movie."],"a":["Ayer, mientras caminaba hacia el trabajo, me encontré con un amigo que no veía desde hacía años.","Yesterday, while I was walking to work, I ran into a friend I hadn't seen for years."]},"la semana":{"b":["La semana empieza.","The week begins."],"i":["Trabajo cinco días a la semana y descanso el sábado y el domingo.","I work five days a week and rest on Saturday and Sunday."],"a":["Durante la semana pasada no pude dormir bien porque tenía muchas cosas en la cabeza.","During the past week I couldn't sleep well because I had a lot on my mind."]},"el mes":{"b":["El mes tiene treinta días.","The month has thirty days."],"i":["Cada mes pago la cuenta de la luz y compro comida para la familia.","Every month I pay the electric bill and buy food for the family."],"a":["Hace un mes que empecé a estudiar español, y ya puedo entender casi todo lo que me dicen.","It's been a month since I started studying Spanish, and I can already understand almost everything they tell me."]},"el año":{"b":["El año termina.","The year ends."],"i":["Cada año viajamos a la costa para visitar a mis tíos.","Every year we travel to the coast to visit my aunts and uncles."],"a":["El año pasado cambié de trabajo, me mudé de casa y aprendí a cocinar mejor que nunca.","Last year I changed jobs, moved house and learned to cook better than ever."]},"la hora":{"b":["¿Qué hora es?","What time is it?"],"i":["No tengo reloj, así que le pregunto la hora a mi compañero.","I don't have a watch, so I ask my coworker what time it is."],"a":["Cuando miré la hora, me di cuenta de que había pasado toda la tarde leyendo.","When I looked at the time, I realized I had spent the whole afternoon reading."]},"la noche":{"b":["La noche es tranquila.","The night is calm."],"i":["Por la noche leo un libro y me acuesto temprano.","At night I read a book and go to bed early."],"a":["Durante la noche cayó tanta nieve que por la mañana no pudimos abrir la puerta.","During the night so much snow fell that in the morning we couldn't open the door."]},"comer":{"b":["Yo como pan.","I eat bread."],"i":["Yo como arroz con pollo todos los domingos con mi familia.","I eat rice with chicken every Sunday with my family."],"a":["Ayer comí tanto en la fiesta que hoy no quiero ver comida.","Yesterday I ate so much at the party that today I don't want to see food."]},"beber":{"b":["Yo bebo agua.","I drink water."],"i":["Yo bebo un vaso de agua cada mañana antes del desayuno.","I drink a glass of water every morning before breakfast."],"a":["Después de correr bajo el sol, bebí tanta agua que casi no podía caminar.","After running in the sun, I drank so much water that I could hardly walk."]},"correr":{"b":["Yo corro rápido.","I run fast."],"i":["Yo corro por el parque tres veces a la semana con mi vecino.","I run through the park three times a week with my neighbor."],"a":["Cuando vi que el autobús se iba, corrí lo más rápido que pude, pero no lo alcancé.","When I saw the bus leaving, I ran as fast as I could, but I didn't catch it."]},"dormir":{"b":["Yo duermo ocho horas.","I sleep eight hours."],"i":["Yo duermo ocho horas cada noche porque me levanto temprano.","I sleep eight hours every night because I get up early."],"a":["Anoche dormí muy mal porque mis vecinos hicieron una fiesta hasta la madrugada.","Last night I slept very badly because my neighbors had a party until dawn."]},"leer":{"b":["Yo leo un libro.","I read a book."],"i":["Yo leo un capítulo cada noche antes de dormir.","I read a chapter every night before going to sleep."],"a":["Cuando éramos niños, leíamos debajo de las sábanas con una linterna para que nuestros padres no nos vieran.","When we were kids, we used to read under the sheets with a flashlight so our parents wouldn't see us."]},"escribir":{"b":["Yo escribo una carta.","I write a letter."],"i":["Yo escribo en mi cuaderno todos los días antes de cenar.","I write in my notebook every day before dinner."],"a":["Escribí tres veces el mismo mensaje porque no sabía cómo explicarle lo que sentía.","I wrote the same message three times because I didn't know how to explain to her what I felt."]},"bailar":{"b":["Yo bailo salsa.","I dance salsa."],"i":["Yo bailo con mis amigos todos los sábados en la noche.","I dance with my friends every Saturday night."],"a":["Aunque nunca había bailado en público, me animé y terminé bailando toda la noche.","Although I had never danced in public, I got up the courage and ended up dancing all night."]},"cantar":{"b":["Yo canto bien.","I sing well."],"i":["Yo canto en la ducha todas las mañanas, pero nadie me escucha.","I sing in the shower every morning, but nobody hears me."],"a":["Cuando mi abuela empezó a cantar, todos nos quedamos en silencio para escucharla.","When my grandmother started singing, we all fell silent to listen to her."]},"nadar":{"b":["Yo nado en el mar.","I swim in the sea."],"i":["Yo nado en la piscina todos los viernes después del trabajo.","I swim in the pool every Friday after work."],"a":["Nadamos hasta la isla aunque el agua estaba fría y el mar se movía mucho.","We swam to the island even though the water was cold and the sea was rough."]},"saltar":{"b":["Yo salto alto.","I jump high."],"i":["Yo salto la cuerda con mis primos en el patio todas las tardes.","I jump rope with my cousins on the patio every afternoon."],"a":["Cuando vi la serpiente, salté hacia atrás tan rápido que me caí sobre el pasto.","When I saw the snake, I jumped back so fast that I fell onto the grass."]},"el libro":{"b":["Leo el libro.","I read the book."],"i":["Leo el libro en clase y después hago la tarea en casa.","I read the book in class and then do the homework at home."],"a":["Mi amigo me prestó el libro y lo terminé en dos días porque no podía dejar de leerlo.","My friend lent me the book and I finished it in two days because I couldn't stop reading it."]},"el lápiz":{"b":["Uso un lápiz.","I use a pencil."],"i":["Uso un lápiz para escribir y una goma para borrar mis errores.","I use a pencil to write and an eraser to erase my mistakes."],"a":["Se me rompió el lápiz en medio del examen, y mi compañero me prestó el suyo.","My pencil broke in the middle of the exam, and my classmate lent me his."]},"la mochila":{"b":["Llevo la mochila.","I carry the backpack."],"i":["Llevo la mochila a la escuela con mis libros y mi almuerzo.","I carry my backpack to school with my books and my lunch."],"a":["Cuando llegué a la escuela, me di cuenta de que había dejado la mochila en el autobús.","When I got to school, I realized I had left my backpack on the bus."]},"el maestro":{"b":["El maestro explica.","The teacher explains."],"i":["El maestro explica la lección con ejemplos para que todos entendamos.","The teacher explains the lesson with examples so that we all understand."],"a":["El maestro nos pidió que escribiéramos una historia, y la mía fue la que más le gustó.","The teacher asked us to write a story, and mine was the one he liked the most."]},"la escuela":{"b":["Voy a la escuela.","I go to school."],"i":["Voy a la escuela en bicicleta porque queda cerca de mi casa.","I go to school by bike because it's close to my house."],"a":["Cuando terminó la escuela, mis amigos y yo prometimos que nos veríamos cada año.","When school ended, my friends and I promised that we would see each other every year."]},"el examen":{"b":["Tengo un examen.","I have an exam."],"i":["Tengo un examen de español el viernes, así que estudio todas las noches.","I have a Spanish exam on Friday, so I study every night."],"a":["Estudié toda la semana para el examen y, aun así, me puse tan nervioso que olvidé algunas respuestas.","I studied all week for the exam and, even so, I got so nervous that I forgot some answers."]},"la pizarra":{"b":["Miro la pizarra.","I look at the board."],"i":["El maestro escribe las palabras nuevas en la pizarra cada lunes.","The teacher writes the new words on the board every Monday."],"a":["Cuando pasé a la pizarra, me temblaban tanto las manos que no pude escribir bien.","When I went up to the board, my hands were shaking so much that I couldn't write well."]},"la tijera":{"b":["Uso la tijera.","I use the scissors."],"i":["Uso la tijera para cortar papel de colores en la clase de arte.","I use the scissors to cut colored paper in art class."],"a":["Mi hermano me pidió la tijera prestada y se la llevó sin decirme nada.","My brother asked to borrow the scissors and took them without telling me anything."]},"el papel":{"b":["Necesito papel.","I need paper."],"i":["Necesito una hoja de papel para escribir la lista del mercado.","I need a sheet of paper to write the market list."],"a":["Reciclamos todo el papel que usamos en la escuela para ayudar al medio ambiente.","We recycle all the paper we use at school to help the environment."]},"la regla":{"b":["Uso la regla.","I use the ruler."],"i":["Uso la regla para dibujar líneas rectas en mi cuaderno.","I use the ruler to draw straight lines in my notebook."],"a":["Sin la regla, no habría podido terminar el dibujo que el maestro nos pidió.","Without the ruler, I wouldn't have been able to finish the drawing the teacher asked us for."]},"el aeropuerto":{"b":["Voy al aeropuerto.","I go to the airport."],"i":["Llegamos al aeropuerto dos horas antes del vuelo para no perderlo.","We get to the airport two hours before the flight so we don't miss it."],"a":["Cuando llegamos al aeropuerto, descubrimos que habían cancelado el vuelo por la tormenta.","When we got to the airport, we found out the flight had been canceled because of the storm."]},"la playa":{"b":["Vamos a la playa.","We go to the beach."],"i":["Vamos a la playa cada verano y nadamos hasta la tarde.","We go to the beach every summer and swim until the afternoon."],"a":["Aunque el día estaba nublado, caminamos por la playa hasta que salió el sol.","Although the day was cloudy, we walked along the beach until the sun came out."]},"la ciudad":{"b":["La ciudad es grande.","The city is big."],"i":["Vivo en una ciudad grande donde siempre hay mucho tráfico.","I live in a big city where there is always a lot of traffic."],"a":["Cuando llegué a la ciudad por primera vez, me perdí varias veces antes de aprender el camino.","When I arrived in the city for the first time, I got lost several times before learning the way."]},"el hotel":{"b":["Duermo en el hotel.","I sleep at the hotel."],"i":["Nos quedamos en un hotel cerca de la playa cada verano.","We stay at a hotel near the beach every summer."],"a":["Reservamos el hotel con meses de anticipación, pero al llegar nos dijeron que no tenían nuestra reserva.","We booked the hotel months in advance, but when we arrived they told us they didn't have our reservation."]},"la montaña":{"b":["Subo la montaña.","I climb the mountain."],"i":["Subimos la montaña los domingos y llevamos agua y fruta.","We climb the mountain on Sundays and bring water and fruit."],"a":["Después de caminar cuatro horas, llegamos a la cima de la montaña y vimos todo el valle.","After walking for four hours, we reached the top of the mountain and saw the whole valley."]},"el mercado":{"b":["Voy al mercado.","I go to the market."],"i":["Voy al mercado los sábados para comprar frutas y verduras frescas.","I go to the market on Saturdays to buy fresh fruit and vegetables."],"a":["En el mercado compré tantas frutas que tuve que pedir ayuda para llevarlas a casa.","At the market I bought so much fruit that I had to ask for help to carry it home."]},"el tren":{"b":["El tren llega.","The train arrives."],"i":["Tomo el tren todos los días para ir a trabajar a la ciudad.","I take the train every day to go to work in the city."],"a":["El tren salió tan temprano que tuvimos que levantarnos a las cuatro de la mañana.","The train left so early that we had to get up at four in the morning."]},"el mapa":{"b":["Miro el mapa.","I look at the map."],"i":["Siempre llevo un mapa cuando viajo a una ciudad nueva.","I always carry a map when I travel to a new city."],"a":["Como el teléfono no tenía batería, tuvimos que usar un mapa de papel para encontrar el hotel.","Since the phone had no battery, we had to use a paper map to find the hotel."]},"la maleta":{"b":["Preparo la maleta.","I pack the suitcase."],"i":["Preparo la maleta la noche antes del viaje para no olvidar nada.","I pack the suitcase the night before the trip so I don't forget anything."],"a":["Cuando llegamos al hotel, nos dimos cuenta de que la aerolínea había perdido mi maleta.","When we got to the hotel, we realized the airline had lost my suitcase."]},"el puente":{"b":["Cruzo el puente.","I cross the bridge."],"i":["Cruzo el puente todos los días para llegar al trabajo.","I cross the bridge every day to get to work."],"a":["Construyeron el puente en solo un año, y ahora el viaje es mucho más corto.","They built the bridge in just one year, and now the trip is much shorter."]},"feliz":{"b":["Estoy feliz.","I am happy."],"i":["Estoy feliz porque mi familia viene a visitarme el domingo.","I'm happy because my family is coming to visit me on Sunday."],"a":["Me puse tan feliz cuando recibí la noticia que llamé a todos mis amigos.","I became so happy when I got the news that I called all my friends."]},"triste":{"b":["Estoy triste.","I am sad."],"i":["Me pongo triste cuando mis amigos se van de la ciudad.","I get sad when my friends leave the city."],"a":["Aunque trataba de sonreír, se notaba que estaba triste porque extrañaba a su familia.","Although he tried to smile, it was obvious he was sad because he missed his family."]},"enojado":{"b":["Estoy enojado.","I am angry."],"i":["Mi hermano se pone enojado cuando alguien toca sus cosas.","My brother gets angry when someone touches his things."],"a":["Estaba tan enojado por la discusión que salió de la casa sin decir una sola palabra.","He was so angry about the argument that he left the house without saying a single word."]},"cansado":{"b":["Estoy cansado.","I am tired."],"i":["Estoy cansado porque trabajo muchas horas durante la semana.","I'm tired because I work many hours during the week."],"a":["Llegué tan cansado del viaje que me dormí en el sofá sin cenar.","I arrived so tired from the trip that I fell asleep on the sofa without eating dinner."]},"sorprendido":{"b":["Estoy sorprendido.","I am surprised."],"i":["Estoy sorprendido porque mis amigos prepararon una fiesta para mí.","I'm surprised because my friends prepared a party for me."],"a":["Me quedé sorprendido cuando abrí la puerta y vi que toda mi familia me estaba esperando.","I was surprised when I opened the door and saw that my whole family was waiting for me."]},"asustado":{"b":["Estoy asustado.","I am scared."],"i":["Estoy asustado cuando escucho ruidos extraños en la noche.","I'm scared when I hear strange noises at night."],"a":["El niño se despertó asustado porque había tenido una pesadilla y llamó a su mamá.","The boy woke up scared because he had had a nightmare and called for his mom."]},"emocionado":{"b":["Estoy emocionado.","I am excited."],"i":["Estoy emocionado porque mañana empiezo mi trabajo nuevo.","I'm excited because tomorrow I start my new job."],"a":["Estaba tan emocionado por el viaje que no pude dormir en toda la noche.","I was so excited about the trip that I couldn't sleep all night."]},"nervioso":{"b":["Estoy nervioso.","I am nervous."],"i":["Estoy nervioso porque tengo una entrevista de trabajo esta tarde.","I'm nervous because I have a job interview this afternoon."],"a":["Aunque había practicado mucho, me puse nervioso en cuanto vi a las personas que me iban a evaluar.","Although I had practiced a lot, I got nervous as soon as I saw the people who were going to evaluate me."]},"orgulloso":{"b":["Estoy orgulloso.","I am proud."],"i":["Mi padre está orgulloso de mí porque aprendo español rápido.","My father is proud of me because I learn Spanish fast."],"a":["Mis padres se sintieron muy orgullosos el día en que terminé la universidad.","My parents felt very proud the day I finished university."]},"tranquilo":{"b":["Estoy tranquilo.","I am calm."],"i":["Estoy tranquilo en casa cuando leo un libro con una taza de té.","I'm calm at home when I read a book with a cup of tea."] function sentenceFor(card, lv) {
  const s = SENTENCES[card.es];
  const pair = s ? s[LEVEL_KEY[lv]] : null;
  return pair ? { es: pair[0], en: pair[1] } : { es: card.ex_es, en: card.ex_en };
}

const STORAGE_KEY = "vamos-flashcards-v2";

function freshProgress() {
  return { level: null, points: { beginner: 0, intermediate: 0, advanced: 0 }, known: {}, awarded: {}, offered: {} };
}

function loadProgress() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      const base = freshProgress();
      return { ...base, ...p, points: { ...base.points, ...(p.points || {}) } };
    }
  } catch (e) {}
  return freshProgress();
}

function saveProgress(p) {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
  } catch (e) {}
}

const BALOO = "'Baloo 2', sans-serif";
const menuBtnStyle = {
  width: "100%", fontFamily: BALOO, fontWeight: 700, fontSize: 14, padding: "10px 8px", borderRadius: 12,

};

/* Small icon button used in the bottom dock */
function DockBtn({ icon, label, onClick, disabled, bg }) {
  return (
    <button
      className="btn-pop dockbtn"
      onClick={onClick}
      disabled={disabled}
      aria-label={label}
      style={{ background: bg || "#FFF9EE" }}
    >
      <span style={{ fontSize: 22, lineHeight: 1 }}>{icon}</span>
      <span style={{ fontSize: 10.5, fontWeight: 700 }}>{label}</span>
    </button>
  );
}

function SpanishFlashcards() {
  const [catId, setCatId] = useState("animals");
  const [order, setOrder] = useState(() => DECKS["animals"].map((_, i) => i));
  const [index, setIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [progress, setProgress] = useState(loadProgress);
  const progressRef = useRef(progress);
  progressRef.current = progress;
  const lv = progress.level || "beginner"; // current level
  const mastered = progress.known; // key: level|es -> true
  const [screen, setScreen] = useState(progress.level ? "home" : "levels"); // "levels" | "home" | "play"
  const [levelUp, setLevelUp] = useState(null); // id of the level we are offering, or null
  const [mood, setMood] = useState("idle");
  const [toast, setToast] = useState("");
  const [slide, setSlide] = useState("next"); // direction of the card entrance animation
  const [sheet, setSheet] = useState(null); // null | "cat" | "menu"
  const [voices, setVoices] = useState([]);
  const [isSpeaking, setIsSpeaking] = useState(false);
  const [audioSupported, setAudioSupported] = useState(true);
  const [showDiag, setShowDiag] = useState(false);
  const [volume, setVolume] = useState(1);
  const voiceRef = useRef(null);
  const englishVoiceRef = useRef(null);
  const toastTimer = useRef(null);

  // Swipe gesture tracking on the flashcard
  const swipeStartRef = useRef(null);
  const swipedRef = useRef(false);

  // Speaking-practice (mic) state
  const [micSupported, setMicSupported] = useState(true);
  const [listening, setListening] = useState(false);
  const [speechResult, setSpeechResult] = useState(null);
  const [micError, setMicError] = useState("");
  const recognitionRef = useRef(null);

  // App mode: flashcards vs. listening quiz
  const [mode, setMode] = useState("cards");
  const [quizQuestion, setQuizQuestion] = useState(null);
  const [quizSelected, setQuizSelected] = useState(null);
  const [quizScore, setQuizScore] = useState({ correct: 0, total: 0 });

  const category = CATEGORIES.find((c) => c.id === catId);
  const deck = DECKS[catId];
  const card = deck[order[index]];
  const isKnown = !!mastered[`${lv}|${card.es}`];
  const sent = sentenceFor(card, lv);
  const levelInfo = LEVELS.find((l) => l.id === lv);
  const levelPoints = progress.points[lv] || 0;
  const levelGoal = LEVEL_GOALS[lv] || 0;

  useEffect(() => {
    if (typeof window === "undefined" || !window.speechSynthesis) {
      setAudioSupported(false);
      return;
    }
    const loadVoices = () => {
      const list = window.speechSynthesis.getVoices();
      if (list.length) {
        setVoices(list);
        voiceRef.current = pickSpanishVoice(list);
        englishVoiceRef.current = pickEnglishVoice(list);
      }
    };
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
    return () => {
      if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = null;
    };
  }, []);

  useEffect(() => {
    const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
    setMicSupported(!!SR);
  }, []);

  // Clear the mic result whenever the card changes.
  useEffect(() => {
    setSpeechResult(null);
    setMicError("");
  }, [catId, index]);

  useEffect(() => {
    const t = setTimeout(() => setMood("idle"), 900);
    return () => clearTimeout(t);
  }, [mood]);

  // Save progress on this phone.
  useEffect(() => {
    saveProgress(progress);
  }, [progress]);

  // Offer the next level once enough points are earned at the current one.
  useEffect(() => {
    const cur = progress.level;
    const next = NEXT_LEVEL[cur];
    if (!cur || !next) return;
    if ((progress.points[cur] || 0) >= LEVEL_GOALS[cur] && !progress.offered[next]) {
      setLevelUp(next);
      setMood("happy");
      setProgress((p) => ({ ...p, offered: { ...p.offered, [next]: true } }));
    }
  }, [progress.points, progress.level]);

  function showToast(text) {
    setToast(text);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 1300);
  }

  function randomOf(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function speak(text, opts = {}) {
    if (!audioSupported || typeof window === "undefined" || !window.speechSynthesis) return;
    const { lang = "es", rate = 0.9, onEnd } = opts;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voice = lang === "en" ? englishVoiceRef.current : voiceRef.current;
    utter.lang = voice ? voice.lang : lang === "en" ? "en-US" : "es-419";
    if (voice) utter.voice = voice;
    utter.rate = rate;
    utter.volume = volume;
    utter.pitch =
      lang === "en" || (voice && MALE_NAME_HINTS.some((h) => voice.name.toLowerCase().includes(h))) ? 1 : 0.85;
    utter.onstart = () => setIsSpeaking(true);
    utter.onend = () => {
      setIsSpeaking(false);
      if (onEnd) onEnd();
    };
    utter.onerror = () => setIsSpeaking(false);
    window.speechSynthesis.speak(utter);
  }

  function speakSpanish(text, rate = 0.9) {
    speak(text, { lang: "es", rate });
  }
  // Says the pair: "el perro ... dog"
  function speakBoth(esText, enText) {
    speak(esText, { lang: "es", rate: 0.9, onEnd: () => speak(enText, { lang: "en", rate: 0.95 }) });
  }

  const masteredCount = useMemo(
    () => deck.filter((c) => mastered[`${lv}|${c.es}`]).length,
    [deck, mastered, lv]
  );

  // Points are earned once per word, per activity and per level, so repeating a card never adds more.
  function addPoints(n, awardKey) {
    if (progressRef.current.awarded[awardKey]) return false;
    progressRef.current = { ...progressRef.current, awarded: { ...progressRef.current.awarded, [awardKey]: true } };
    setProgress((p) => {
      if (p.awarded[awardKey]) return p;
      const L = p.level || "beginner";
      return {
        ...p,
        awarded: { ...p.awarded, [awardKey]: true },
        points: { ...p.points, [L]: (p.points[L] || 0) + n },
      };
    });
    return true;
  }

  function pickCategory(id) {
    setSlide("next");
    setCatId(id);
    setOrder(DECKS[id].map((_, i) => i));
    setIndex(0);
    setFlipped(false);
    setMood("idle");
    setSheet(null);
    setMode("cards");
    setScreen("play");
  }

  function goNext() {
    setSlide("next");
    setFlipped(false);
    const nextIndex = (index + 1) % order.length;
    setIndex(nextIndex);
    speak(deck[order[nextIndex]].es);
  }

  function goPrev() {
    setSlide("prev");
    setFlipped(false);
    const prevIndex = (index - 1 + order.length) % order.length;
    setIndex(prevIndex);
    speak(deck[order[prevIndex]].es);
  }

  function doShuffle() {
    const newOrder = shuffle(deck.map((_, i) => i));
    setSlide("next");
    setOrder(newOrder);
    setIndex(0);
    setFlipped(false);
    setMood("idle");
    setSheet(null);
    showToast("¡Barajado!");
    speak(deck[newOrder[0]].es);
  }

  // Tap: flip the card back and forth and say the side that appears
  // ("el perro" <-> "dog"), as many times as you like.
  // Only a swipe (or the keyboard arrows) changes the word.
  function handleCardTap() {
    if (swipedRef.current) {
      swipedRef.current = false;
      return;
    }
    if (flipped) {
      setFlipped(false);
      speak(card.es, { lang: "es", rate: 0.9 });
    } else {
      setFlipped(true);
      speak(speakableEn(card), { lang: "en", rate: 0.95 });
    }
  }

  // Swipe: left -> next, right -> previous (front or back).
  function handleSwipeStart(e) {
    swipeStartRef.current = { x: e.clientX, y: e.clientY };
    swipedRef.current = false;
  }
  function handleSwipeEnd(e) {
    const start = swipeStartRef.current;
    swipeStartRef.current = null;
    if (!start) return;
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      swipedRef.current = true;
      if (dx < 0) goNext();
      else goPrev();
    }
  }
  function handleSwipeCancel() {
    swipeStartRef.current = null;
  }

  // "Lo sé" marks the word as known (+10 points the first time at each level) and moves on;
  // tap it again on a known word to unmark it.
  function toggleKnown() {
    const key = `${lv}|${card.es}`;
    if (mastered[key]) {
      setProgress((p) => {
        const known = { ...p.known };
        delete known[key];
        return { ...p, known };
      });
      setMood("encourage");
      showToast("Sigue practicando");
    } else {
      setProgress((p) => ({ ...p, known: { ...p.known, [key]: true } }));
      const got = addPoints(10, "k|" + key);
      setMood("happy");
      showToast(randomOf(ENCOURAGE) + (got ? " +10 ⭐" : ""));
      setTimeout(goNext, 500);
    }
  }

  // Keyboard support for desktop: ← → to move, space/enter to flip.
  const keyRef = useRef({});
  keyRef.current = { mode, sheet, screen, levelUp, goNext, goPrev, handleCardTap };
  useEffect(() => {
    const onKey = (e) => {
      const k = keyRef.current;
      if (k.screen !== "play" || k.mode !== "cards" || k.sheet || k.levelUp) return;
      if (e.key === "ArrowRight") k.goNext();
      else if (e.key === "ArrowLeft") k.goPrev();
      else if (e.key === " " || e.key === "Enter") {
        if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
        e.preventDefault();
        k.handleCardTap();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  /* ------------------------------------------------------------
     SPEAKING PRACTICE (mic)
  ------------------------------------------------------------ */
  function startListening(langIndex = 0) {
    const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
    if (!SR) {
      setMicError("El reconocimiento de voz no está disponible en este navegador.");
      return;
    }
    setMicError("");
    setSpeechResult(null);
    // Stop any voice that is still talking so the microphone doesn't pick it up.
    if (typeof window !== "undefined" && window.speechSynthesis) window.speechSynthesis.cancel();

    const recognition = new SR();
    recognition.lang = RECOGNITION_LANGS[langIndex];
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 5;

    recognition.onstart = () => setListening(true);
    recognition.onresult = (e) => {
      // Take the best-matching of the recognizer's alternatives.
      const alts = Array.from(e.results[0]).map((a) => a.transcript);
      let best = null;
      alts.forEach((t) => {
        const d = diffWords(t, card.es);
        if (!best || d.score > best.score) best = { transcript: t, ...d };
      });
      if (best) {
        setSpeechResult(best);
        if (best.score >= 80 && addPoints(5, "s|" + lv + "|" + card.es)) showToast("¡Bien dicho! +5 ⭐");
      }
    };
    recognition.onerror = (e) => {
      setListening(false);
      if (e.error === "language-not-supported" && langIndex + 1 < RECOGNITION_LANGS.length) {
        startListening(langIndex + 1);
        return;
      }
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        setMicError("Permiso de micrófono denegado. Revisa los permisos del navegador.");
      } else if (e.error === "no-speech") {
        setMicError("No se detectó voz. Inténtalo de nuevo.");
      } else {
        setMicError("No se pudo usar el micrófono. Inténtalo de nuevo.");
      }
    };
    recognition.onend = () => setListening(false);

    recognitionRef.current = recognition;
    try {
      recognition.start();
    } catch {
      setMicError("No se pudo iniciar el micrófono.");
    }
  }

  function stopListening() {
    if (recognitionRef.current) recognitionRef.current.stop();
    setListening(false);
  }

  /* ------------------------------------------------------------
     LISTENING QUIZ
  ------------------------------------------------------------ */
  // Beginner hears a word and picks its meaning; intermediate and advanced hear the level's sentence
  // and pick its translation.
  const quizByWord = lv === "beginner";
  function quizAudioText(w) {
    return quizByWord ? w.es : sentenceFor(w, lv).es;
  }
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  function quizOptionText(w) {
    return cap(quizByWord ? withThe(w) : sentenceFor(w, lv).en);
  }

  function newQuizQuestion() {
    const all = Object.values(DECKS).flat();
    const correct = all[Math.floor(Math.random() * all.length)];
    const distractors = shuffle(all.filter((w) => quizOptionText(w) !== quizOptionText(correct))).slice(0, 3);
    const options = shuffle([correct, ...distractors]);
    setQuizQuestion({ word: correct, options, correctIndex: options.indexOf(correct) });
    setQuizSelected(null);
  }

  function selectQuizAnswer(i) {
    if (quizSelected !== null) return;
    setQuizSelected(i);
    const isCorrect = i === quizQuestion.correctIndex;
    setQuizScore((s) => ({ correct: s.correct + (isCorrect ? 1 : 0), total: s.total + 1 }));
    setMood(isCorrect ? "happy" : "encourage");
    const got = isCorrect && addPoints(5, "q|" + lv + "|" + quizQuestion.word.es);
    showToast(isCorrect ? randomOf(ENCOURAGE) + (got ? " +5 ⭐" : "") : randomOf(NUDGE));
  }

  function openQuiz() {
    setMode("quiz");
    setScreen("play");
    setSheet(null);
    newQuizQuestion();
  }

  function goHome() {
    if (typeof window !== "undefined" && window.speechSynthesis) window.speechSynthesis.cancel();
    setScreen("home");
    setSheet(null);
  }

  function chooseLevel(id) {
    setProgress((p) => ({ ...p, level: id }));
    setQuizQuestion(null);
    setQuizScore({ correct: 0, total: 0 });
    setLevelUp(null);
    setScreen("home");
    setSheet(null);
  }

  function resetProgress() {
    if (typeof window !== "undefined" && !window.confirm("¿Borrar todos los puntos y el progreso?")) return;
    setProgress(freshProgress());
    setQuizQuestion(null);
    setQuizScore({ correct: 0, total: 0 });
    setLevelUp(null);
    setScreen("levels");
    setSheet(null);
  }

  const mascotAccent = mode === "quiz" ? "#6C4AB6" : category.accent;
  const mascotDark = mode === "quiz" ? "#3A2668" : category.dark;

  return (
    <div
      style={{
        width: "100%",
        minHeight: "100vh",
        display: "flex",
        justifyContent: "center",
        alignItems: "center",
        background: "#FFE380",
        backgroundImage:
          "radial-gradient(circle at 8% 12%, rgba(255,255,255,0.5) 0, transparent 40%), radial-gradient(circle at 92% 88%, rgba(255,255,255,0.35) 0, transparent 45%)",
        fontFamily: "'Quicksand', sans-serif",
        color: "#20232B",
      }}
    >

            }}
          >
            <div style={{ fontSize: 54, lineHeight: 1 }}>🎉</div>
            <div style={{ fontFamily: BALOO, fontWeight: 800, fontSize: 25, marginTop: 6 }}>¡Subiste de nivel!</div>
            <div style={{ fontWeight: 600, fontSize: 15, margin: "8px 0 16px", lineHeight: 1.4 }}>
              Ya tienes {levelPoints} puntos en {levelInfo.label}. ¿Quieres pasar a {LEVELS.find((l) => l.id === levelUp).label}?
            </div>
            <button className="btn-pop" onClick={() => chooseLevel(levelUp)} style={{ ...menuBtnStyle, background: "#B7F0C6" }}>
              Pasar a {LEVELS.find((l) => l.id === levelUp).label} ▶
            </button>
            <button className="btn-pop" onClick={() => setLevelUp(null)} style={{ ...menuBtnStyle, marginBottom: 0 }}>
              Seguir en {levelInfo.label}
            </button>
          </div>
        </div>
      )}

      {/* ---------- Options sheet ---------- */}
      {sheet === "menu" && (
        <div className="backdrop" onClick={() => setSheet(null)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 800, fontSize: 20, marginBottom: 12 }}>
              Opciones
            </div>

            {screen !== "home" && (
              <button className="btn-pop" onClick={goHome} style={menuBtnStyle}>
                🏠 Inicio (categorías)
              </button>
            )}
            <button className="btn-pop" onClick={() => { setScreen("levels"); setSheet(null); }} style={menuBtnStyle}>
              🎓 Cambiar de nivel
            </button>

            <div style={{ display: "flex", alignItems: "center", gap: 10, background: "#fff", border: "3px solid #20232B", borderRadius: 12, padding: "8px 12px", marginBottom: 14 }}>
              <span style={{ fontSize: 18 }}>{volume === 0 ? "🔇" : volume < 0.5 ? "🔉" : "🔊"}</span>
              <input
                type="range" min="0" max="1" step="0.05" value={volume}
                onChange={(e) => setVolume(parseFloat(e.target.value))}
                aria-label="Volumen"
                style={{ flex: 1, accentColor: category.accent }}
              />
            </div>

            {screen === "play" && mode === "cards" && (
              <button
                className="btn-pop"
                onClick={doShuffle}
                style={{
                  width: "100%", fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 14,
                  padding: "10px 8px", borderRadius: 12, border: "3px solid #20232B", background: "#fff",
                  boxShadow: "3px 3px 0 #20232B", cursor: "pointer", marginBottom: 14, color: "#20232B",
                }}
              >
                🔀 Barajar tarjetas
              </button>
            )}

            <button className="btn-pop" onClick={resetProgress} style={{ ...menuBtnStyle, background: "#FFD2D2" }}>
              🗑️ Reiniciar puntos y progreso
            </button>

            <button
              onClick={() => setShowDiag((d) => !d)}
              style={{ background: "none", border: "none", textDecoration: "underline", fontSize: 12.5, fontWeight: 700, color: "#20232B", opacity: 0.6, cursor: "pointer", padding: 0 }}
            >
              {showDiag ? "ocultar diagnóstico de audio ▲" : "¿no hay audio? revisa aquí 🔍"}
            </button>

            {showDiag && (
              <div style={{ marginTop: 10, background: "#fff", border: "3px solid #20232B", borderRadius: 14, padding: "10px 12px", fontSize: 12.5, fontWeight: 600, lineHeight: 1.7 }}>
                <div>🔧 API compatible: {audioSupported ? "✅ sí" : "❌ no — tu navegador no soporta audio de voz"}</div>
                <div>🎙️ Voces en español encontradas: {voices.filter((v) => v.lang.toLowerCase().startsWith("es")).length}</div>
                <div>🗣️ Voz seleccionada: {voiceRef.current ? `${voiceRef.current.name} (${voiceRef.current.lang})` : "ninguna — usando voz predeterminada del sistema"}</div>
                <button
                  className="btn-pop"
                  onClick={() => speak("Hola, esto es una prueba de audio.")}
                  style={{ marginTop: 8, fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 13, padding: "8px 14px", borderRadius: 12, border: "3px solid #20232B", background: "#FFE380", boxShadow: "3px 3px 0 #20232B", cursor: "pointer", color: "#20232B" }}
                >
                  🔊 Probar audio ahora
                </button>
                <div style={{ marginTop: 8, opacity: 0.7, fontWeight: 500 }}>
                  Si no suena: revisa el interruptor de silencio (iPhone), el volumen de medios (no el del timbre), o instala una voz en español en los ajustes de tu teléfono.
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SpanishFlashcards />);
</script>
</body>
</html>
